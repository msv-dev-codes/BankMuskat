<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Bank Muskat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container" id="loginForm">
        <h1 class="topHeader">Bank Muskat</h1>
        <h1 class="loginTitle">Enter your login credentials</h1>

        <div class="inform">
            <form id="loginForm">

                <label class="username">UserName : </label> <br>
                <input type="text" placeholder="Enter your UserName" id="textusername"> <br><br>

                <label class="password">Password : </label> <br>
                <input type="text" placeholder="Enter valid password" id="textpassword"> <br><br>

                <button type="submit">Submit</button>

                <p>Not registered? <a> Create a new Account</a></p>
            </form>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
